e){return null;}return u.getUser().then(function(x){window.cgUser=(x&&x.username)||'';}).catch(function(){});}).catch(function(e){console.warn('CrazyGames SDK',e);window.ecLang=chosen||ecFallback();}).then(done);}catch(e){console.warn('CrazyGames SDK',e);window.ecLang=chosen||ecFallback();done();}};if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',start);}else{start();}var Ctx=window.AudioContext||window.webkitAudioContext;if(Ctx){var all=[];var Wrapped=function(){var c=new (Function.prototype.bind.apply(Ctx,[null].concat([].slice.call(arguments))))();all.push(c);return c;};Wrapped.prototype=Ctx.prototype;window.AudioContext=Wrapped;if(window.webkitAudioContext){window.webkitAudioContext=Wrapped;}var wake=function(){all.forEach(function(c){if(c.state==='suspended'){c.resume();}});};['touchend','click','keydown'].forEach(function(t){document.addEventListener(t,wake,true);});}})();</script>"
