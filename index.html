html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #e1f1f6;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<script>(function(){window.ecLang='en';document.documentElement.lang='en';document.title='Energy Crisis';document.addEventListener('DOMContentLoaded',function(){document.title='Energy Crisis';});})();</script><meta name="description" content="A game about saving electricity: switch off the appliances in the flat before the grid overloads and the fuses blow. 10 floors and endless ones after them, right in the browser."><meta name="theme-color" content="#eaf2f4"><meta property="og:type" content="website"><meta property="og:site_name" content="Energy Crisis"><meta property="og:title" content="Energy Crisis"><meta property="og:description" content="A game about saving electricity: switch off the appliances in the flat before the grid overloads and the fuses blow. Right in the browser."><meta property="og:url" content="https://olprmk.github.io/energy-crisis/"><meta property="og:image" content="https://olprmk.github.io/energy-crisis/og.png?v=2"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="Energy Crisis: the child in a living room with the appliances on"><meta property="og:locale" content="en_US"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://olprmk.github.io/energy-crisis/og.png?v=2"><style>body, #status { background: linear-gradient(#eaf2f4, #d7f0f7) !important; } #status-splash, #status-progress { visibility: hidden !important; } #ec-loader { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 5; overflow: hidden; background: linear-gradient(#eaf2f4, #d7f0f7); } #ec-loader > * { position: absolute; left: 50%; --vh: 1vh; } @supports (height: 1dvh) { #ec-loader > * { --vh: 1dvh; } } #ec-loader > * { --u: min(max(calc(100vw / 1280), calc(var(--vh) * 100 / 720)), calc(100vw / 300)); } #ec-loader img { width: calc(var(--u) * 1280); height: calc(var(--u) * 720); top: 50%; transform: translate(-50%, -50%); } #ec-loader .ec-bar { top: calc(50% + var(--u) * 115); width: calc(var(--u) * 185); height: max(2px, calc(var(--u) * 3)); transform: translateX(-50%); background: #7bacbc; } #ec-loader .ec-bar i { display: block; height: 100%; width: 0; background: #ffae00; } @media (orientation: portrait) and (max-width: 600px) { #ec-loader > * { --p: calc(100vw / 402); } #ec-loader img { width: calc(var(--p) * 1088); height: calc(var(--p) * 612); top: calc(26.09% - var(--p) * 205.76); transform: translateX(-50%); } #ec-loader .ec-bar { top: calc(26.09% + var(--p) * 209); width: calc(var(--p) * 185); height: max(2px, calc(var(--p) * 3)); } } @media (orientation: landscape) and (max-height: 500px) { #ec-loader > * { --p: calc(var(--vh) * 100 / 402); } #ec-loader img { width: calc(var(--p) * 1088); height: calc(var(--p) * 612); top: calc(var(--p) * -141.76); transform: translateX(-50%); } #ec-loader .ec-bar { top: calc(var(--p) * 302); width: calc(var(--p) * 185); height: max(2px, calc(var(--p) * 3)); } }</style><script>(function(){function start(){var d=document.createElement('div');d.id='ec-loader';d.innerHTML='<img src="index.png" alt=""><div class="ec-bar"><i></i></div>';document.body.appendChild(d);var fill=d.querySelector('i'),shown=0,done=false;function tick(){if(done){return;}var n=document.getElementById('status-notice');if(n&&n.style.display==='block'){done=true;d.remove();return;}var p=document.getElementById('status-progress'),f=shown;if(p&&p.max>0&&p.value>0){f=0.85*p.value/p.max;}else if(!document.getElementById('status')){f=shown+(0.98-shown)*0.015;}if(f>shown){shown=f;fill.style.width=(shown*100).toFixed(1)+'%';}requestAnimationFrame(tick);}tick();window.ecReady=function(){if(done){return;}done=true;fill.style.width='100%';d.style.transition='opacity .35s';d.style.opacity='0';setTimeout(function(){d.remove();},400);};setTimeout(function(){window.ecReady();},90000);}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',start);}else{start();}})();</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":21167928,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
